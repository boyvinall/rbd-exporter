version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 1
      min-occurrences: 4
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - style
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 160
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        source: ^//go:generate
      - linters:
          - revive
        text: unused-parameter:.*consider removing or renaming it as _
      - path: (.+)\.go$
        text: unnecessary leading newline
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/boyvinall/openstack-check-exporter
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
